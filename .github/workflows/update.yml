name: Update wallpapers

on:
  schedule:
    - cron: "0 0 * * 1"   # 매주 월요일 09:00 (한국 시간)
  workflow_dispatch:
    inputs:
      add:
        description: "새 사진 넣기 (끄면 blocklist와 보관만 적용)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: wallpapers
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --quiet "pillow==11.3.0"

      - name: Add new photos and archive old ones
        env:
          GH_TOKEN: ${{ github.token }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: python tools/update.py ${{ github.event_name == 'workflow_dispatch' && !inputs.add && '--no-add' || '' }}

      - name: Commit the photo list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json archive/index.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update wallpapers $(date -u +%Y-%m-%d)"
            git push
          fi

      # 앱이 읽는 목록을 먼저 올린 뒤에, 목록에서 빠진 사진 파일을 지운다
      - name: Remove photos that left the list
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/update.py --prune
